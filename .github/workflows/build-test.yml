name: CI Build

on: [push, pull_request]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-test-win:
    timeout-minutes: 60
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
     fail-fast: false
     matrix:
      os:
        - windows-2025
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
        lfs: 'true'
    - run: git fetch --tags

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Verify package READMEs
      shell: pwsh
      run: ./tools/Verify-PackageReadmes.ps1

    - name: Test
      timeout-minutes: 30
      run: dotnet test -c Release --no-restore --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type full

  build-test-crossplatform:
    timeout-minutes: 60
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
     fail-fast: false
     matrix:
      os:
        - ubuntu-24.04
        - macos-15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
        lfs: 'true'
    - run: git fetch --tags

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Verify package READMEs
      shell: pwsh
      run: ./tools/Verify-PackageReadmes.ps1

    - name: Test (.NET 10)
      timeout-minutes: 30
      run: |
        dotnet test Tests/LibraryTests/LibraryTests.csproj -c Release --no-restore -f net10.0 --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type full
        dotnet test Tests/RegistrationTests/RegistrationTests.csproj -c Release --no-restore -f net10.0 --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type full

    - name: Test (.NET 11)
      timeout-minutes: 30
      run: dotnet test -c Release --no-restore -f net11.0 --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type full
