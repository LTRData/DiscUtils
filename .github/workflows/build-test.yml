name: CI Build

on: [push, pull_request]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-test:
    timeout-minutes: 60
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
     fail-fast: false
     matrix:
      os:
        - windows-2025
        - ubuntu-24.04
        - macos-15
      dotnet:
        - 10.0.x
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
        lfs: 'true'
    - run: git fetch --tags

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ matrix.dotnet }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Test
      timeout-minutes: 30
      run: dotnet test -c Release --no-restore --no-build --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type full

    - name: Pack
      if: github.ref == 'refs/heads/develop'
      run: dotnet pack -c Release -o ${{ github.workspace }}/build

    - name: "GitHub packages: NuGet push"
      if: github.ref == 'refs/heads/develop'
      run: dotnet nuget push *.nupkg --no-symbols 1 --skip-duplicate -k ${{ secrets.GITHUB_TOKEN }} -s "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
      working-directory: ${{ github.workspace }}/build
